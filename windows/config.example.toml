# Windows 本地配置样例（可选）
#
# 本助手不需要配置文件就能运行。这个文件只用于固定端口或跳过自动发现。
# 复制为 config.toml 后使用；config.toml 已在 .gitignore 中，不会被提交。

[engine]
# 指定运行中的引擎地址。设置后不会自动拉起引擎。
# 留空则自动探测 127.0.0.1:8899-8903。
url = ""

# 自动拉起引擎时使用的首个候选端口（仅作记录，实际会依次探测 8899-8903）。
port = 8899

# 是否允许自动拉起引擎。设为 false 时只连接已运行的实例。
auto_launch = true

[session]
# 定位测试默认保持秒数（限制在 60-1800 之间）。
hold_seconds = 180

[safety]
# 非回环地址一律拒绝，此值不可修改为 false。
require_loopback = true
